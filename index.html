<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #2d1b1b, #8a584d); color: white; min-height: 100vh; }
        nav { display: flex; justify-content: space-between; padding: 30px 10%; align-items: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
        .contact-btn { border: 2px solid #ff7f50; padding: 8px 20px; border-radius: 25px; }
        .hero-container { display: flex; align-items: center; justify-content: space-around; padding: 50px 10%; flex-wrap: wrap; }
        .text-section { max-width: 500px; }
        .text-section h1 { font-size: 55px; margin-bottom: 20px; }
        .hire-btn { background: #ff7f50; padding: 15px 30px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
        .hero-image { width: 350px; height: 350px; border-radius: 50%; background-color: #555; border: 5px solid rgba(255,255,255,0.2); overflow: hidden; }
        .hero-image img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <nav>
        <div><strong>Michael</strong></div>
        <div>
            <a href="#">Home</a> <a href="#">About</a> <a href="#">Service</a>
            <a href="#" class="contact-btn">Contact</a>
        </div>
    </nav>
    <div class="hero-container">
        <div class="text-section">
            <h1>Michael <br> User Interface <br> Designer</h1>
            <p>Waxaan ahay horumariye websit-yada iyo naqshadeeye jecel hal-abuurka.</p>
            <button class="hire-btn">Hire Me Now</button>
        </div>
        <div class="hero-image">
            <img src="safa.jpeg" alt="Safa Maxamuud">
        </div>
    </div>
</body>
