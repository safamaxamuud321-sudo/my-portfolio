<!DOCTYPE html>
<html>
<head>
    <style>
        /* Midabka asalka oo gradient ah */
        body { 
            margin: 0; 
            font-family: 'Arial', sans-serif; 
            background: linear-gradient(135deg, #2d1b1b, #8a584d); 
            color: white; 
            min-height: 100vh;
        }
        
        /* Navigation Bar */
        nav { display: flex; justify-content: space-between; padding: 30px 10%; align-items: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
        .contact-btn { border: 2px solid #ff7f50; padding: 8px 20px; border-radius: 25px; transition: 0.3s; }
        .contact-btn:hover { background: #ff7f50; }

        /* Qaybta Hero */
        .hero-container { 
            display: flex; 
            align-items: center; 
            justify-content: space-around; 
            padding: 50px 10%; 
            flex-wrap: wrap;
        }
        .text-section { max-width: 500px; }
        .text-section h1 { font-size: 55px; margin-bottom: 20px; line-height: 1.2; }
        .hire-btn { background: #ff7f50; padding: 15px 30px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
        
        /* Goobaabinta Sawirka */
        .hero-image { 
            width: 350px; 
            height: 350px; 
            border-radius: 50%; 
            background-color: #555; 
            border: 5px solid rgba(255,255,255,0.2);
            overflow: hidden; /* Waxay sawirka ku haysaa gudaha goobada */
        }
        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
